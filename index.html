<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>かわいいスイカゲーム 🍉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js 物理エンジン -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            background-color: #fff0f5; /* パステルピンク背景 */
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none; /* スマホでのスクロールを防止 */
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 400px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }
        canvas {
            background-color: #ffe4e1;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }
        .score-box {
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-weight: bold;
            color: #ff6b81;
            font-size: 1.2rem;
            border: 2px solid #ff4757;
        }
        .next-box {
            background: white;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #ff4757;
        }
        .next-label {
            font-size: 0.8rem;
            color: #ff4757;
            font-weight: bold;
            margin-bottom: 4px;
        }
        #next-fruit-display {
            font-size: 2rem;
            line-height: 1;
        }
        
        /* ゲームオーバー画面 */
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        #game-over-screen h1 {
            color: #ff4757;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px white;
        }
        #final-score {
            font-size: 2rem;
            font-weight: bold;
            color: #2f3542;
            margin-bottom: 30px;
        }
        #restart-btn {
            background: #ff4757;
            color: white;
            font-size: 1.5rem;
            padding: 12px 32px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s, background 0.2s;
            pointer-events: auto;
        }
        #restart-btn:active {
            transform: scale(0.95);
            background: #ff6b81;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div class="score-box">
            スコア: <span id="score-display">0</span>
        </div>
        <div class="next-box">
            <span class="next-label">NEXT</span>
            <div id="next-fruit-display">🍒</div>
        </div>
    </div>
    
    <canvas id="game-canvas"></canvas>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <div id="final-score">Score: 0</div>
        <button id="restart-btn" onclick="restartGame()">もういちど遊ぶ 🍉</button>
    </div>
</div>

<script>
    // --- ゲーム設定 ---
    const GAME_WIDTH = 420;
    const GAME_HEIGHT = 650;
    const WALL_THICKNESS = 60;
    const GAME_OVER_LINE_Y = 120; // この高さを超えるとゲームオーバー

    // フルーツの種類（レベル、絵文字、半径、色、スコア）
    const FRUITS = [
        { level: 0, emoji: '🍒', radius: 15, color: '#ffb3ba', score: 1 },
        { level: 1, emoji: '🍓', radius: 22, color: '#ffdfba', score: 3 },
        { level: 2, emoji: '🍇', radius: 30, color: '#ffffba', score: 6 },
        { level: 3, emoji: '🍊', radius: 38, color: '#baffc9', score: 10 },
        { level: 4, emoji: '🍎', radius: 48, color: '#bae1ff', score: 15 },
        { level: 5, emoji: '🍐', radius: 58, color: '#e2f0cb', score: 21 },
        { level: 6, emoji: '🍑', radius: 68, color: '#f3c4fb', score: 28 },
        { level: 7, emoji: '🍍', radius: 82, color: '#fff4cc', score: 36 },
        { level: 8, emoji: '🍈', radius: 98, color: '#c3f0ca', score: 45 },
        { level: 9, emoji: '🍉', radius: 115, color: '#ffb3ba', score: 55 }
    ];

    // --- Matter.js モジュールの準備 ---
    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Events = Matter.Events,
          Body = Matter.Body,
          Vector = Matter.Vector;

    let engine, world;
    let canvas, ctx;
    
    // ゲーム状態
    let currentScore = 0;
    let nextFruitLevel = 0;
    let currentDroppingFruit = null;
    let isGameOver = false;
    let canDrop = true;
    let dropCooldown = false;
    let mouseX = GAME_WIDTH / 2;
    
    // ゲームオーバー判定用タイマー
    let gameOverTimer = 0;

    // --- 初期化 ---
    function init() {
        canvas = document.getElementById('game-canvas');
        ctx = canvas.getContext('2d');
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        engine = Engine.create();
        world = engine.world;
        
        // 重力設定
        engine.gravity.y = 1.5;

        // 壁と床の作成 (見えない壁)
        const wallOptions = { 
            isStatic: true, 
            render: { visible: false },
            friction: 0.2,
            restitution: 0.1
        };
        const ground = Bodies.rectangle(GAME_WIDTH / 2, GAME_HEIGHT + WALL_THICKNESS / 2 - 10, GAME_WIDTH + WALL_THICKNESS*2, WALL_THICKNESS, wallOptions);
        const leftWall = Bodies.rectangle(-WALL_THICKNESS / 2, GAME_HEIGHT / 2, WALL_THICKNESS, GAME_HEIGHT * 2, wallOptions);
        const rightWall = Bodies.rectangle(GAME_WIDTH + WALL_THICKNESS / 2, GAME_HEIGHT / 2, WALL_THICKNESS, GAME_HEIGHT * 2, wallOptions);
        
        Composite.add(world, [ground, leftWall, rightWall]);

        // 衝突イベント（フルーツの進化）
        Events.on(engine, 'collisionStart', handleCollision);

        // 入力イベントの設定
        setupInputs();

        // 最初のフルーツをセット
        generateNextFruit();

        // メインループの開始
        requestAnimationFrame(gameLoop);
    }

    // --- フルーツの生成 ---
    function getRandomDropFruitLevel() {
        // レベル0(チェリー)〜レベル4(リンゴ)までがランダムで出現
        const dropProbabilities = [0, 0, 0, 1, 1, 2, 2, 3, 4];
        return dropProbabilities[Math.floor(Math.random() * dropProbabilities.length)];
    }

    function generateNextFruit() {
        currentDroppingFruit = nextFruitLevel;
        nextFruitLevel = getRandomDropFruitLevel();
        document.getElementById('next-fruit-display').innerText = FRUITS[nextFruitLevel].emoji;
        canDrop = true;
    }

    // 物理世界にフルーツを落とす
    function dropFruit(x) {
        if (!canDrop || isGameOver || dropCooldown) return;
        
        dropCooldown = true;
        canDrop = false;

        const fruitInfo = FRUITS[currentDroppingFruit];
        
        // 壁にめり込まないようにX座標を制限
        const minX = fruitInfo.radius;
        const maxX = GAME_WIDTH - fruitInfo.radius;
        const safeX = Math.max(minX, Math.min(maxX, x));

        // フルーツのBodyを作成
        const fruit = Bodies.circle(safeX, 50, fruitInfo.radius, {
            restitution: 0.2, // 少し弾む
            friction: 0.1,    // 摩擦
            density: 0.001 * (currentDroppingFruit + 1), // 大きいほど重く
            label: 'fruit',
            plugin: {
                level: currentDroppingFruit,
                isMerged: false // 1フレームで複数回結合しないためのフラグ
            }
        });

        Composite.add(world, fruit);

        // 次のフルーツ準備までのクールダウン（1秒）
        setTimeout(() => {
            if(!isGameOver) {
                dropCooldown = false;
                generateNextFruit();
            }
        }, 1000);
    }

    // --- 衝突と進化の処理 ---
    function handleCollision(event) {
        if(isGameOver) return;
        
        const pairs = event.pairs;
        
        for (let i = 0; i < pairs.length; i++) {
            const bodyA = pairs[i].bodyA;
            const bodyB = pairs[i].bodyB;

            // 両方がフルーツであるか確認
            if (bodyA.label === 'fruit' && bodyB.label === 'fruit') {
                const levelA = bodyA.plugin.level;
                const levelB = bodyB.plugin.level;

                // 同じレベルかつ、最大レベル(スイカ)未満、かつまだマージ処理中ではない
                if (levelA === levelB && levelA < FRUITS.length - 1 && !bodyA.plugin.isMerged && !bodyB.plugin.isMerged) {
                    
                    // マージ済みにマーク
                    bodyA.plugin.isMerged = true;
                    bodyB.plugin.isMerged = true;

                    // 中間地点を計算
                    const newX = (bodyA.position.x + bodyB.position.x) / 2;
                    const newY = (bodyA.position.y + bodyB.position.y) / 2;
                    const newLevel = levelA + 1;

                    // スコア加算 (進化したフルーツのスコアを入れる)
                    addScore(FRUITS[newLevel].score);

                    // 古いフルーツを削除
                    Composite.remove(world, bodyA);
                    Composite.remove(world, bodyB);

                    // 新しいフルーツを作成
                    const newFruitInfo = FRUITS[newLevel];
                    const newFruit = Bodies.circle(newX, newY, newFruitInfo.radius, {
                        restitution: 0.1,
                        friction: 0.1,
                        density: 0.001 * (newLevel + 1),
                        label: 'fruit',
                        plugin: {
                            level: newLevel,
                            isMerged: false
                        }
                    });
                    
                    // 少し跳ねさせる演出
                    Body.setVelocity(newFruit, { x: 0, y: -2 });

                    Composite.add(world, newFruit);
                }
            }
        }
    }

    // --- スコア管理 ---
    function addScore(points) {
        currentScore += points;
        document.getElementById('score-display').innerText = currentScore;
    }

    // --- 入力（マウス・タッチ）処理 ---
    function setupInputs() {
        const handleMove = (e) => {
            if(isGameOver) return;
            let clientX;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }
            
            // キャンバス内の相対座標に変換
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            mouseX = (clientX - rect.left) * scaleX;
        };

        const handleDrop = (e) => {
            if(e.cancelable) e.preventDefault();
            if (canDrop && !dropCooldown && !isGameOver) {
                dropFruit(mouseX);
            }
        };

        // マウス
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mousedown', handleDrop);
        
        // タッチ
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchstart', (e) => {
            handleMove(e);
            handleDrop(e);
        }, {passive: false});
    }

    // --- ゲームオーバー判定 ---
    function checkGameOver() {
        if(isGameOver) return;

        let hasHighFruit = false;
        const fruits = Composite.allBodies(world).filter(b => b.label === 'fruit');
        
        for (let fruit of fruits) {
            // 静止していて、かつデッドラインを超えているか
            if (fruit.position.y - FRUITS[fruit.plugin.level].radius < GAME_OVER_LINE_Y && fruit.velocity.y < 1 && fruit.velocity.y > -1) {
                hasHighFruit = true;
                break;
            }
        }

        // 継続して超えていたらゲームオーバー
        if (hasHighFruit) {
            gameOverTimer++;
            if (gameOverTimer > 60) { // 約1秒間ラインを超え続けたら
                triggerGameOver();
            }
        } else {
            gameOverTimer = 0; // セーフならリセット
        }
    }

    function triggerGameOver() {
        isGameOver = true;
        document.getElementById('final-score').innerText = `Score: ${currentScore}`;
        document.getElementById('game-over-screen').style.display = 'flex';
    }

    // --- リスタート ---
    window.restartGame = function() {
        // 全フルーツ削除
        const fruits = Composite.allBodies(world).filter(b => b.label === 'fruit');
        fruits.forEach(f => Composite.remove(world, f));

        // ステータス初期化
        currentScore = 0;
        document.getElementById('score-display').innerText = currentScore;
        isGameOver = false;
        gameOverTimer = 0;
        dropCooldown = false;
        document.getElementById('game-over-screen').style.display = 'none';

        nextFruitLevel = getRandomDropFruitLevel();
        generateNextFruit();
    };

    // --- 描画とメインループ ---
    function gameLoop() {
        // 物理エンジンの更新
        Engine.update(engine, 1000 / 60);

        // 画面のクリア
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ゲームオーバー線の描画
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(0, GAME_OVER_LINE_Y);
        ctx.lineTo(canvas.width, GAME_OVER_LINE_Y);
        ctx.strokeStyle = '#ff4757';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]); // リセット

        // フルーツの描画
        const bodies = Composite.allBodies(world);
        for (let body of bodies) {
            if (body.label === 'fruit') {
                const info = FRUITS[body.plugin.level];
                
                // 回転を考慮した描画
                ctx.translate(body.position.x, body.position.y);
                ctx.rotate(body.angle);

                // 背景の丸
                ctx.beginPath();
                ctx.arc(0, 0, info.radius, 0, 2 * Math.PI);
                ctx.fillStyle = info.color;
                ctx.fill();
                
                // 枠線
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.stroke();

                // 絵文字の描画
                ctx.font = `${info.radius * 1.3}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // 少し上にずらすと絵文字が中心に来やすい
                ctx.fillText(info.emoji, 0, info.radius * 0.1); 

                ctx.rotate(-body.angle);
                ctx.translate(-body.position.x, -body.position.y);
            }
        }

        // 落とす前のフルーツ（ゴースト）の描画
        if (canDrop && !isGameOver) {
            const dropInfo = FRUITS[currentDroppingFruit];
            // 範囲制限
            const minX = dropInfo.radius;
            const maxX = GAME_WIDTH - dropInfo.radius;
            const safeX = Math.max(minX, Math.min(maxX, mouseX));

            ctx.globalAlpha = 0.6; // 半透明
            
            // 落下予定の線
            ctx.beginPath();
            ctx.moveTo(safeX, 50);
            ctx.lineTo(safeX, canvas.height);
            ctx.strokeStyle = '#ffb3ba';
            ctx.lineWidth = 2;
            ctx.stroke();

            // フルーツ
            ctx.beginPath();
            ctx.arc(safeX, 50, dropInfo.radius, 0, 2 * Math.PI);
            ctx.fillStyle = dropInfo.color;
            ctx.fill();
            
            ctx.font = `${dropInfo.radius * 1.3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(dropInfo.emoji, safeX, 50 + dropInfo.radius * 0.1); 
            
            ctx.globalAlpha = 1.0;
        }

        // ゲームオーバー判定
        checkGameOver();

        // 次のフレームを要求
        requestAnimationFrame(gameLoop);
    }

    // 初期化処理の実行
    window.onload = init;

</script>
</body>
</html>
